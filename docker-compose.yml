# Alpha-Engine2 — Docker Compose
# Secrets come from .env (env_file). Do not hardcode passwords/tokens here.
# FastAPI service `api` is disabled by default (profile: api).

services:

  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: alpha_postgres
    command:
      - postgres
      - -c
      - max_locks_per_transaction=256
      - -c
      - max_pred_locks_per_transaction=256
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alpha_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-alpha_engine}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-Asia/Riyadh}
      PGTZ: ${TZ:-Asia/Riyadh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./scripts/init_sahmk_tables.sql:/docker-entrypoint-initdb.d/02_sahmk.sql
    ports:
      - "5432:5432"
    networks:
      - alpha_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alpha_user} -d ${POSTGRES_DB:-alpha_engine}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: alpha_redis
    env_file:
      - .env
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    environment:
      TZ: ${TZ:-Asia/Riyadh}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - alpha_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpha_app
    command: python scripts/main.py
    env_file:
      - .env
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Asia/Riyadh}
      - PYTHONIOENCODING=utf-8
      - LANG=ar_SA.UTF-8
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alpha_network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from scripts.database import db; from scripts.redis_manager import redis_manager; assert db.test_connection() and redis_manager.client.ping()\""]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpha_celery_worker
    command: celery -A scripts.celery_app worker --loglevel=info --concurrency=4 --queues=default,high_priority,normal,low_priority,maintenance
    env_file:
      - .env
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Asia/Riyadh}
      - PYTHONIOENCODING=utf-8
      - LANG=ar_SA.UTF-8
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alpha_network
    healthcheck:
      test: ["CMD-SHELL", "celery -A scripts.celery_app inspect ping -d celery@$${HOSTNAME} --timeout=10 >/dev/null 2>&1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpha_celery_beat
    command: celery -A scripts.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Asia/Riyadh}
      - PYTHONIOENCODING=utf-8
      - LANG=ar_SA.UTF-8
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alpha_network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from scripts.redis_manager import redis_manager; assert redis_manager.client.ping()\""]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpha_flower
    command: celery -A scripts.celery_app flower --port=5555
    env_file:
      - .env
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Asia/Riyadh}
      - PYTHONIOENCODING=utf-8
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
    networks:
      - alpha_network
    restart: unless-stopped

  market_reporter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpha_market_reporter
    command: python scripts/run_market_reporter.py
    env_file:
      - .env
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Asia/Riyadh}
      - PYTHONIOENCODING=utf-8
      - LANG=ar_SA.UTF-8
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alpha_network
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpha_dashboard
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    env_file:
      - .env
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Asia/Riyadh}
      - PYTHONIOENCODING=utf-8
      - LANG=ar_SA.UTF-8
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alpha_network
    restart: unless-stopped

  telegram_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpha_telegram_bot
    command: python scripts/telegram_bot.py
    env_file:
      - .env
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Asia/Riyadh}
      - PYTHONIOENCODING=utf-8
      - LANG=ar_SA.UTF-8
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alpha_network
    restart: unless-stopped

  freqtrade:
    image: freqtradeorg/freqtrade:stable_freqai
    container_name: alpha_freqtrade
    command: >
      trade
      --config /freqtrade/user_data/config.json
      --strategy FreqAIStrategy
      --freqaimodel LightGBMClassifier
    environment:
      - TZ=${TZ:-Asia/Riyadh}
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=INFO
    ports:
      - "8080:8080"
    volumes:
      - ./freqtrade:/freqtrade/user_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alpha_network
    restart: unless-stopped

  api:
    profiles:
      - api
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpha_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Asia/Riyadh}
      - PYTHONIOENCODING=utf-8
      - LANG=ar_SA.UTF-8
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alpha_network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10).read()\""]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    restart: unless-stopped

networks:
  alpha_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
