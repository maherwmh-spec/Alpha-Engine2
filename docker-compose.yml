# Alpha-Engine2 — Docker Compose
# NOTE: `version` key removed (obsolete in modern Docker Compose)
# FIX #0: Added TZ=Asia/Riyadh to all services to enforce Saudi timezone (UTC+3)
# FIX #1: Added REDIS_PASSWORD env var to ALL services that use Redis (NOAUTH fix)

services:

  # ── PostgreSQL with TimescaleDB ─────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: alpha_postgres
    environment:
      POSTGRES_USER: alpha_user
      POSTGRES_PASSWORD: alpha_password_2024
      POSTGRES_DB: alpha_engine
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Riyadh
      PGTZ: Asia/Riyadh
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./scripts/init_sahmk_tables.sql:/docker-entrypoint-initdb.d/02_sahmk.sql
    ports:
      - "5432:5432"
    networks:
      - alpha_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpha_user -d alpha_engine"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: alpha_redis
    command: redis-server --appendonly yes --requirepass alpha_redis_password_2024
    environment:
      TZ: Asia/Riyadh
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - alpha_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a alpha_redis_password_2024 ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Main Application ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpha_app
    command: python scripts/main.py
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Riyadh
      - PYTHONIOENCODING=utf-8
      - LANG=ar_SA.UTF-8
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alpha_network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from scripts.database import db; from scripts.redis_manager import redis_manager; assert db.test_connection() and redis_manager.client.ping()\""]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ── Celery Worker ────────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpha_celery_worker
    command: celery -A scripts.celery_app worker --loglevel=info --concurrency=4 --queues=default,high_priority,normal,low_priority,maintenance
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Riyadh
      - PYTHONIOENCODING=utf-8
      - LANG=ar_SA.UTF-8
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alpha_network
    healthcheck:
      test: ["CMD-SHELL", "celery -A scripts.celery_app inspect ping -d celery@$${HOSTNAME} --timeout=10 >/dev/null 2>&1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  # ── Celery Beat (Scheduler) ──────────────────────────────────
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpha_celery_beat
    command: celery -A scripts.celery_app beat --loglevel=info
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Riyadh
      - PYTHONIOENCODING=utf-8
      - LANG=ar_SA.UTF-8
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alpha_network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from scripts.redis_manager import redis_manager; assert redis_manager.client.ping()\""]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ── Flower (Celery Monitoring) ───────────────────────────────
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpha_flower
    command: celery -A scripts.celery_app flower --port=5555
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Riyadh
      - PYTHONIOENCODING=utf-8
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
    networks:
      - alpha_network
    restart: unless-stopped

  # ── Market Reporter ──────────────────────────────────────────
  market_reporter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpha_market_reporter
    command: python -m bots.market_reporter.bot
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Riyadh
      - PYTHONIOENCODING=utf-8
      - LANG=ar_SA.UTF-8
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alpha_network
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1

  # ── Dashboard (Streamlit) ────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpha_dashboard
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Riyadh
      - PYTHONIOENCODING=utf-8
      - LANG=ar_SA.UTF-8
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alpha_network
    restart: unless-stopped

  # ── Telegram Bot ─────────────────────────────────────────────
  telegram_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpha_telegram_bot
    command: python scripts/telegram_bot.py
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Riyadh
      - PYTHONIOENCODING=utf-8
      - LANG=ar_SA.UTF-8
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alpha_network
    restart: unless-stopped

  # ── Freqtrade (Backtesting & Paper Trading) ──────────────────
  freqtrade:
    image: freqtradeorg/freqtrade:stable_freqai
    container_name: alpha_freqtrade
    command: >
      trade
      --config /freqtrade/user_data/config.json
      --strategy FreqAIStrategy
      --freqaimodel LightGBMClassifier
    environment:
      - TZ=Asia/Riyadh
      - APP_ENV=production
      - LOG_LEVEL=INFO
    ports:
      - "8080:8080"
    volumes:
      - ./freqtrade:/freqtrade/user_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alpha_network
    restart: unless-stopped


  # ── FastAPI Operational API ───────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpha_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Riyadh
      - PYTHONIOENCODING=utf-8
      - LANG=ar_SA.UTF-8
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alpha_network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10).read()\""]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    restart: unless-stopped

networks:
  alpha_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
